<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUO GW45 ADAP14</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#344054}.top{height:72px;border-top:3px solid #ef3340;border-bottom:1px solid #ddd;padding:8px 5%;display:flex;align-items:center;gap:12px;position:relative}.back{font-size:28px;color:#1677d2}.title{font-size:24px;font-weight:700;color:#ef3340}.plus{border:1px solid #ddd;border-radius:14px;padding:4px 10px}.sub{position:absolute;top:48px;left:5%;font-size:12px}.wrap{padding:28px 5%;max-width:1600px}.section{margin-bottom:38px}.section h2{font-size:18px;font-weight:400;margin:0 0 28px}.table{width:100%;border-collapse:collapse}.table th{background:#f2f2f2;text-align:left;font-weight:400;padding:11px 22px}.table td{border-bottom:1px solid #ddd;padding:11px 22px;height:43px}.table th:not(:first-child),.table td:not(:first-child){text-align:center}.sensor{display:flex;align-items:center;gap:10px;text-align:left}.dot{width:13px;height:13px;border-radius:50%;display:inline-block;flex:none}.btn{border:1px solid #d0d5dd;border-radius:18px;background:#fff;color:#667085;padding:5px 28px;cursor:pointer}.meta{color:#667085;font-size:12px;text-align:right;margin-top:12px}.empty{text-align:center;padding:30px;color:#98a2b3}@media(max-width:700px){.wrap{padding:20px 2%}.table th,.table td{padding:9px 7px}.title{font-size:18px}.btn{padding:5px 12px}}
</style></head>
<body><header class="top"><span class="back">‹</span><span class="title">Unisafe ULT</span><span class="plus">Plus</span><span class="sub">Temperature Monitoring</span></header>
<main class="wrap" id="app"><div class="empty">Loading telemetry…</div></main>
<script>
const groups={Temperature:[['display_temperature','Display Temperature'],['ambient','Ambient'],['setpoint','Setpoint'],['warm_alarm','Warm Alarm'],['cold_alarm','Cold Alarm'],['first_stage_suction','First Stage Suction (Probe 1)'],['evaporator_inlet_a','Evaporator Inlet A (Probe 3)'],['evaporator_outlet_a','Evaporator Outlet A (Probe 4)'],['water_temperature_outlet','Water Temperature Outlet (Probe 5)'],['second_stage_suction','Second Stage Suction (Probe 6)'],['liquid_line_a','Liquid Line A (Probe 7)'],['evaporator_inlet_b','Evaporator Inlet B (Probe 8)'],['evaporator_outlet_b','Evaporator Outlet B (Probe 9)'],['liquid_line_b','Liquid Line B (Probe 10)'],['user_control_offset','User Control Offset'],['control_rtd_raw','Control RTD Raw'],['control_rtd_managed_high_res','Control RTD Managed High Res'],['bus_setpoint','Bus Setpoint'],['bus_temperature','Bus Temperature']],Voltage:[['input_line_voltage','Input Line Voltage'],['compensated_line_voltage','Compensated Line Voltage'],['system_battery_voltage','System Battery Voltage'],['bus_battery_voltage','Bus Battery Voltage'],['line_voltage','Line Voltage']],State:[['refrigeration_state','Refrigeration State'],['bus_type','Bus Type']],Speed:[['hs_comp','HS Comp'],['ls_comp','LS Comp'],['compressor_1_rpm','Compressor 1 RPM'],['compressor_2_rpm','Compressor 2 RPM'],['fan_rpm','Fan RPM']],Current:[['system_battery_current','System Battery Current'],['bus_battery_current','Bus Battery Current'],['line_current','Line Current']],Power:[['line_power','Line Power']]};
const colors=['#3b82f6','#0786b5','#6d5bd0','#e52b2f','#8d638e','#8b55bd','#a600ff','#3656d9','#d94700','#421010','#b83c00','#1313ad','#997000','#29c8d0','#31e83b','#91b8c2','#e600dd','#f4c51c','#e79b17'];
function value(d,k){const a={display_temperature:'temperature',ambient:'ambient_temperature',setpoint:'set_point'};return d[k]??d[a[k]]??null}
function render(d){let html='',i=0;for(const [group,items] of Object.entries(groups)){html+=`<section class="section"><h2>${group}</h2><table class="table"><thead><tr><th>Sensor Name</th><th>Low</th><th>Set point</th><th>High</th><th>ⓘ Graph</th><th>ⓘ Summary Card</th></tr></thead><tbody>`;for(const [key,label] of items){const v=value(d,key),shown=v==null?'−':typeof v==='number'?v.toFixed(2):v;html+=`<tr><td><span class="sensor"><i class="dot" style="background:${colors[i++%colors.length]}"></i>${label}</span></td><td>−</td><td>${shown}</td><td>−</td><td><button class="btn">Add</button></td><td><button class="btn">Add</button></td></tr>`}html+='</tbody></table></section>'}html+=`<div class="meta">Device: ${d.device_id??'Waiting for data'} · Last received: ${d.received_at?new Date(d.received_at).toLocaleString():'—'}</div>`;document.getElementById('app').innerHTML=html}
async function update(){try{const r=await fetch('/api/temperature');render(await r.json())}catch(e){document.getElementById('app').innerHTML='<div class="empty">Unable to load telemetry</div>'}}update();setInterval(update,3000);
</script></body></html>
